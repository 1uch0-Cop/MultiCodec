[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hackcop-multicodec"
version = "0.9.0"
description = "Herramienta educativa para conversiones Base64, hexadecimal, ROT13, URL y binario UTF-8."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "1uch0-Cop" }
]
keywords = [
    "education",
    "base64",
    "hexadecimal",
    "rot13",
    "binary",
    "ctf",
    "cybersecurity"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Education",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Education",
    "Topic :: Security"
]
dependencies = []

[project.optional-dependencies]
dev = [
    "build>=1.2,<2",
    "pytest>=8,<10"
]

[project.scripts]
multicodec = "converter:main"
multicodec-gui = "gui:main"

[project.urls]
Repository = "https://github.com/1uch0-Cop/MultiCodec"
Issues = "https://github.com/1uch0-Cop/MultiCodec/issues"

[tool.setuptools]
py-modules = [
    "converter",
    "gui"
]

[tool.pytest.ini_options]
testpaths = [
    "tests"
]
addopts = "-ra"
